<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FindIt AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #0d1512;
      color: #f1f5f9;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .retry-btn {
      margin-top: 24px;
      padding: 10px 20px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h2>FindIt AI</h2>
  <p id="status-text">Connecting to dev server...</p>
  <button class="retry-btn" id="retry-btn" onclick="location.reload()">Retry Connection</button>

  <script>
    const CANDIDATES = [
      "http://127.0.0.1:8000",
      "http://localhost:8000",
      "http://10.30.234.158:8000"
    ];

    async function attemptConnection() {
      for (const targetUrl of CANDIDATES) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 1200);
          await fetch(targetUrl, { signal: controller.signal, mode: 'no-cors' });
          clearTimeout(timer);
          window.location.replace(targetUrl);
          return;
        } catch (e) {
          // Continue to next candidate
        }
      }
      // If all checks timed out, fallback to active host IP
      setTimeout(() => {
        window.location.replace("http://10.30.234.158:8000");
      }, 1500);

      // Show retry after 5s if still hanging
      setTimeout(() => {
        document.getElementById("status-text").innerText = "Server not responding. Ensure phone and PC are on same Wi-Fi (10.30.234.158) or USB connected.";
        document.getElementById("retry-btn").style.display = "inline-block";
      }, 4000);
    }

    attemptConnection();
  </script>
</body>
</html>
